<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍭 ClassDojo Chaos Royale: 10 Players 🍭</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Zcool+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff0f5;
            --accent: #fdffb6;
            --text: #5d576b;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#ffd1dc 20%, transparent 20%), radial-gradient(#bde0fe 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: 'Zcool KuaiLe', sans-serif;
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        header {
            text-align: center;
            padding: 10px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-radius: 0 0 30px 30px;
            z-index: 10;
            flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 2rem; color: #ff9a9e; }

        /* --- 竞技场 --- */
        .arena-container {
            flex: 1;
            position: relative;
            max-width: 1200px;
            margin: 10px auto;
            width: 100%;
            /* 移除Grid，完全依靠JS计算位置 */
        }

        /* 选手卡片 */
        .fighter {
            position: absolute;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s, opacity 0.5s, top 0.5s, left 0.5s;
            width: 110px; /* 默认宽度变小以适应更多人 */
            z-index: 10;
        }
        
        /* 掉落动画 */
        @keyframes dropOut {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            20% { transform: scale(1.1) rotate(-10deg); opacity: 1; }
            100% { transform: translateY(800px) rotate(45deg) scale(0.5); opacity: 0; }
        }

        .fighter.dead {
            animation: dropOut 1s forwards ease-in;
            pointer-events: none;
        }

        /* 血条 */
        .hp-box {
            width: 90%; height: 12px; background: #eee; border-radius: 10px;
            overflow: hidden; margin-bottom: 2px; position: relative;
            border: 1px solid #fff;
        }
        .hp-bar { height: 100%; width: 100%; transition: width 0.5s ease-out; }
        
        .hp-text { position: absolute; width: 100%; text-align: center; line-height: 12px; color: #fff; font-size: 0.6rem; font-weight: bold; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); top:0; left:0;}

        .avatar { font-size: 3.5rem; margin: 0; filter: drop-shadow(0 5px 0 rgba(0,0,0,0.1)); transition: transform 0.2s; }
        
        .name { font-size: 0.9rem; background: #f4f4f4; padding: 2px 8px; border-radius: 20px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* 中央日志 */
        .center-stage {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255,255,255,0.92);
            border-radius: 50%; /* 圆形 */
            padding: 20px;
            border: 6px dashed #ffd6a5;
            box-shadow: 0 0 50px rgba(255, 214, 165, 0.3);
            z-index: 5;
        }

        .log-content { font-size: 1.2rem; line-height: 1.4; width: 100%; }
        .skill-name { color: #ff9a9e; font-size: 1.4rem; display: block; margin: 5px 0; font-weight: bold; animation: popIn 0.3s; }
        .dmg { color: #ff6b6b; font-size: 1.8rem; font-weight: 900; animation: popIn 0.3s; display: block; margin-top: 5px; }
        
        /* CHASE 砸入特效 */
        .chase-smash {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
            z-index: 1000;
            text-shadow: 2px 2px 0 #000;
            white-space: nowrap;
            animation: stampIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
        }
        .smash-dmg { background: #ff6b6b; border: 4px solid #fff; transform: rotate(-10deg); }
        .smash-heal { background: #4ecdc4; border: 4px solid #fff; transform: rotate(10deg); }

        /* 选人区 */
        .roster-area {
            background: #fff;
            height: 25vh;
            border-radius: 30px 30px 0 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            z-index: 30;
        }
        .roster-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            overflow-y: auto;
            width: 100%;
            padding: 5px;
        }
        .chip {
            background: #f8f9fa; padding: 6px 12px; border-radius: 20px; cursor: pointer;
            border: 2px solid transparent; font-size: 0.9rem; color: #666; transition: all 0.2s;
        }
        .chip:hover { transform: translateY(-3px); background: #e9ecef; }
        .chip.selected { background: #ff9a9e; color: #fff; font-weight: bold; box-shadow: 0 4px 0 #e07f7f; border-color: #fff; }

        /* 按钮 */
        .btn {
            background: linear-gradient(to bottom, #9bf6ff, #a0c4ff);
            color: #fff; border: none; padding: 8px 30px; font-size: 1.2rem;
            border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #7fa6e0;
            transition: all 0.1s; margin-bottom: 5px; font-family: 'Zcool KuaiLe';
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        .btn:disabled { background: #ddd; color: #aaa; box-shadow: none; cursor: not-allowed; transform: none; }
        .btn.restart { background: linear-gradient(to bottom, #caffbf, #9bf6ff); box-shadow: 0 5px 0 #8bc4a0; color: #444; animation: pulse 1s infinite; }

        #flash { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,192,203,0.6); pointer-events: none; opacity: 0; z-index: 99; }
        .flash-anim { animation: flash 1.5s; }
        .particle { position: absolute; font-size: 2rem; pointer-events: none; animation: drop 1s forwards; z-index: 50; }

        /* Chase 弹窗 */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.85); display: none; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(5px); }
        .modal-box { background: #fff; border: 5px solid #ffadad; padding: 30px; border-radius: 40px; text-align: center; animation: popIn 0.4s; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 320px; }

        @keyframes popIn { 0% {transform:scale(0);} 100% {transform:scale(1);} }
        @keyframes stampIn { 0% {opacity:0; transform:scale(3) rotate(0deg);} 100% {opacity:1; transform:scale(1) rotate(var(--rot));} }
        @keyframes flash { 0%,100% {opacity:0;} 10%,30%,50% {opacity:1; background:#ffc6ff;} 20%,40% {opacity:0.5;} }
        @keyframes shake { 0%,100% {transform:rotate(0);} 25% {transform:rotate(5deg);} 75% {transform:rotate(-5deg);} }
        @keyframes bounce { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-10px);} }
        @keyframes drop { 0% {opacity:1; transform:translateY(0) scale(1);} 100% {opacity:0; transform:translateY(80px) scale(0.5);} }
        @keyframes pulse { 0% {transform:scale(1);} 50% {transform:scale(1.05);} 100% {transform:scale(1);} }

    </style>

    const macaronColors = [
        '#a0c4ff', '#ffadad', '#caffbf', '#bdb2ff', '#ffd6a5', 
        '#fdffb6', '#9bf6ff', '#ffc6ff', '#a0e7e5', '#d4a5a5'
    ];

    // 学生名单
    const studentsData = [
        {name: "柴骅", score: 91}, {name: "陈焕楷", score: 87}, {name: "陈昕泽", score: 114}, {name: "董诗晗", score: 46},
        {name: "高贝拉", score: 136}, {name: "华静", score: 98}, {name: "黄裕瀚", score: 108}, {name: "金依娴", score: 121},
        {name: "李晨滢", score: 136}, {name: "倪瑞祁", score: 47}, {name: "沈远", score: 51}, {name: "王炫茸", score: 103},
        {name: "王子墨", score: 92}, {name: "王子睿", score: 40}, {name: "谢睿彤", score: 60}, {name: "杨依然", score: 93},
        {name: "叶卓骐", score: 46}, {name: "张昕瑜", score: 136}, {name: "郑熙熙", score: 134}, {name: "周卓宸", score: 6}
    ];

    // === 3. 游戏状态 ===
    let fighters = [];
    let isFighting = false;

    // === 4. 初始化选人 ===
    const rosterDiv = document.getElementById('roster');
    studentsData.forEach((s, idx) => {
        const btn = document.createElement('div');
        btn.className = 'chip';
        btn.innerHTML = s.name;
        btn.onclick = () => toggleSelect(idx, btn);
        rosterDiv.appendChild(btn);
    });

    function toggleSelect(idx, el) {
        if (isFighting) return;

        const s = studentsData[idx];
        const existingIdx = fighters.findIndex(f => f.name === s.name);

        if(existingIdx > -1) {
            fighters.splice(existingIdx, 1);
            el.classList.remove('selected');
            el.style.backgroundColor = '';
            el.style.borderColor = '';
            el.style.color = '';
        } else {
            if(fighters.length >= 10) return;
            fighters.push(s);
            el.classList.add('selected');
            
            const color = macaronColors[fighters.length - 1];
            el.style.backgroundColor = color;
            el.style.borderColor = '#fff';
            el.style.color = '#fff';
        }

        const btn = document.getElementById('start-btn');
        if(fighters.length >= 3 && fighters.length <= 10) {
            btn.disabled = false;
            btn.innerText = `🍬 START BATTLE (${fighters.length}) 🍬`;
            btn.classList.remove('restart');
        } else {
            btn.disabled = true;
            btn.innerText = "选 3-10 人开始";
        }
    }

    function handleMainBtn() {
        const btn = document.getElementById('start-btn');
        if (btn.innerText.includes("再来")) {
            resetArena();
        } else {
            startCombat();
        }
    }

    // === 5. 战斗核心 (Battle Royale) ===
    function getRandomDeck() {
        const n = globalNormal.sort(() => 0.5 - Math.random()).slice(0, 17);
        const s = globalStrong.sort(() => 0.5 - Math.random()).slice(0, 2);
        const u = globalUltimate.sort(() => 0.5 - Math.random()).slice(0, 1);
        return [...n, ...s, ...u];
    }

    function renderArena() {
        const arena = document.getElementById('arena');
        arena.innerHTML = '';
        
        const total = fighters.length;
        // 圆形布局参数
        // 假设容器中心是 (50%, 50%)
        // 半径根据容器大小自适应，css 宽高大概 1000px/600px
        // 用相对百分比比较安全
        
        fighters.forEach((f, i) => {
            f.hp = 100;
            f.id = i;
            f.deck = getRandomDeck();
            f.emoji = randomEmojis[Math.floor(Math.random() * randomEmojis.length)];
            f.blockRate = Math.max(1, Math.min(10, Math.floor(f.score / 15)));
            f.color = macaronColors[i];

            const div = document.createElement('div');
            div.className = 'fighter';
            div.setAttribute('data-id', i);
            div.style.borderColor = f.color;
            div.innerHTML = `
                <div class="hp-box">
                    <div class="hp-bar" style="background:${f.color}"></div>
                    <div class="hp-text">100</div>
                </div>
                <div class="avatar">${f.emoji}</div>
                <div class="name">${f.name}</div>
            `;
            
            // 计算位置 (Circle Layout)
            // 角度：从 -90deg (Top) 开始
            const angle = (i / total) * 2 * Math.PI - (Math.PI / 2);
            // 半径：40%
            const r = 42; 
            const x = 50 + r * Math.cos(angle);
            const y = 50 + r * Math.sin(angle);
            
            div.style.left = `calc(${x}% - 55px)`; // center the card width (110/2)
            div.style.top = `calc(${y}% - 60px)`; // center the card height
            
            // 如果人多，稍微缩小卡片
            if (total > 6) {
                div.style.transform = 'scale(0.85)';
            }

            arena.appendChild(div);
        });

        // Center Log
        const log = document.createElement('div');
        log.className = 'center-stage';
        if (total > 6) log.style.transform = "translate(-50%, -50%) scale(0.9)";
        log.innerHTML = `<div class="log-content" id="log-content">大乱斗开始！<br>${total}人混战！</div>`;
        arena.appendChild(log);
    }

    async function startCombat() {
        isFighting = true;
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        document.querySelector('.roster-area').style.pointerEvents = 'none';
        document.querySelector('.roster-area').style.opacity = 0.6;

        renderArena();
        initAudio();

        while (fighters.filter(f => f.hp > 0).length > 1) {
            const alive = fighters.filter(f => f.hp > 0);

            // --- 随机事件 check ---
            const rnd = Math.random();
            if (rnd < 0.08) { // 增加频率
                await triggerEvent("chase");
                if (fighters.filter(f => f.hp > 0).length <= 1) break;
            } else if (rnd < 0.12) { 
                await triggerEvent("magnet");
                if (fighters.filter(f => f.hp > 0).length <= 1) break;
            }

            const attacker = alive[Math.floor(Math.random() * alive.length)];
            const potentialTargets = alive.filter(f => f !== attacker);
            if (potentialTargets.length === 0) break;
            const target = potentialTargets[Math.floor(Math.random() * potentialTargets.length)];

            // Skill
            const skill = attacker.deck[Math.floor(Math.random() * attacker.deck.length)];
            
            let dmg = 0;
            let sound = 'happy';
            let isUlt = false;

            if (skill.t === '普通') { dmg = rand(1, 20); sound = 'happy'; }
            else if (skill.t === '强力') { dmg = rand(20, 30); sound = 'strong'; }
            else { dmg = rand(50, 100); isUlt = true; sound = 'ult'; }

            const blocked = Math.random() * 100 < target.blockRate;

            const logContent = document.getElementById('log-content');
            
            let html = `
                <div style="color:${attacker.color}; font-weight:bold; font-size:1.4rem;">${attacker.name}</div>
                <span class="skill-name" style="font-size:1.1rem;">${skill.n}</span>
                <div style="font-size:0.9rem; color:#666; margin-bottom:5px;">${skill.e}</div>
                <div style="font-size:1rem;">➡ 攻击 <span style="color:${target.color}; font-weight:bold;">${target.name}</span></div>
            `;
            logContent.innerHTML = html;

            const atkEl = document.querySelector(`.fighter[data-id="${attacker.id}"]`);
            atkEl.style.zIndex = 100;
            atkEl.style.transform = `scale(1.2)`; // 攻击者放大提示
            await wait(200);
            atkEl.style.transform = fighters.length > 6 ? 'scale(0.85)' : 'scale(1)';
            atkEl.style.zIndex = 10;

            if(isUlt) triggerFlash();

            if (blocked) {
                logContent.innerHTML += `<div style="color:#aaa; margin-top:5px; font-weight:bold;">🛡️ 被挡下了!</div>`;
                playTone('block');
            } else {
                playTone(sound);
                spawnParticles(target.id);
                
                target.hp -= dmg;
                updateHP(target.id, target.hp);

                const defEl = document.querySelector(`.fighter[data-id="${target.id}"]`);
                defEl.style.animation = 'shake 0.4s';
                setTimeout(()=>defEl.style.animation='', 400);

                logContent.innerHTML += `<span class="dmg">-${dmg}</span>`;
            }

            if (target.hp <= 0) {
                target.hp = 0;
                const deadEl = document.querySelector(`.fighter[data-id="${target.id}"]`);
                deadEl.classList.add('dead');
                // 掉落动画
                playTone('lose'); 
                logContent.innerHTML += `<div style="color:var(--text); font-weight:bold; margin-top:5px;">💀 ${target.name} 出局!</div>`;
                await wait(1000);
            }

            await wait(1500);
        }

        endGame();
    }

    async function triggerEvent(type) {
        if (type === 'chase') {
            playTone('chase');
            const events = [
                {msg: "CHASE 问：你单词过了！", val: -10},
                {msg: "CHASE 问：你校裤呢？", val: -10},
                {msg: "CHASE 问：39分才进校？", val: -10},
                {msg: "CHASE 问：你是不是吃了两份？", val: -15},
                {msg: "CHASE 问：反思呢？", val: -10},
                {msg: "CHASE 扔出了奶茶！(全员+20)", val: 20}
            ];
            const ev = events[Math.floor(Math.random()*events.length)];
            
            const overlay = document.createElement('div');
            overlay.className = ev.val > 0 ? 'chase-smash smash-heal' : 'chase-smash smash-dmg';
            overlay.innerHTML = `⚠️ ${ev.msg}`;
            // 随机位置
            overlay.style.top = (30 + Math.random()*40) + '%';
            overlay.style.left = (30 + Math.random()*40) + '%';
            overlay.style.transform = `translate(-50%, -50%) rotate(${Math.random()*20-10}deg)`;
            
            document.body.appendChild(overlay);

            fighters.forEach(f => {
                if (f.hp > 0) {
                    f.hp += ev.val;
                    if(f.hp > 100) f.hp = 100;
                    if(f.hp <= 0) {
                        f.hp = 0;
                        document.querySelector(`.fighter[data-id="${f.id}"]`).classList.add('dead');
                    }
                    updateHP(f.id, f.hp);
                }
            });
            await wait(2000);
            overlay.remove();

        } else {
            playTone('block'); 
            const overlay = document.createElement('div');
            overlay.className = 'chase-smash smash-dmg'; 
            overlay.style.background = '#a0c4ff';
            overlay.innerHTML = `🧲 灾害-丢磁铁<br>全员扣 10 HP!`;
            overlay.style.top = '50%'; overlay.style.left = '50%';
            overlay.style.transform = `translate(-50%, -50%) rotate(${Math.random()*20-10}deg)`;
            document.body.appendChild(overlay);

            fighters.forEach(f => {
                if (f.hp > 0) {
                    f.hp -= 10;
                    if(f.hp <= 0) {
                        f.hp = 0;
                        document.querySelector(`.fighter[data-id="${f.id}"]`).classList.add('dead');
                    }
                    updateHP(f.id, f.hp);
                }
            });
            await wait(2000);
            overlay.remove();
        }
    }

    function updateHP(id, val) {
        if (val < 0) val = 0;
        const el = document.querySelector(`.fighter[data-id="${id}"]`);
        el.querySelector('.hp-bar').style.width = val + '%';
        el.querySelector('.hp-text').innerText = val;
    }

    function triggerFlash() {
        const el = document.getElementById('flash');
        el.className = 'flash-anim';
        setTimeout(() => el.className = '', 1500);
    }

    function spawnParticles(targetId) {
        const card = document.querySelector(`.fighter[data-id="${targetId}"]`);
        if(!card) return;
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        
        const symbols = ["💦", "💕"];
        for(let i=0; i<6; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[rand(0,1)];
            p.style.left = (cx + rand(-40, 40)) + 'px';
            p.style.top = (cy + rand(-40, 40)) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }
    }

    function endGame() {
        isFighting = false;
        const btn = document.getElementById('start-btn');
        const log = document.getElementById('log-content');
        
        const survivor = fighters.find(f => f.hp > 0);
        
        if (survivor) {
            log.innerHTML = `<div style="color:var(--accent); font-size:2rem; font-weight:bold; text-shadow:2px 2px 0 #ccc;">🏆 ${survivor.name} 最终获胜!</div>`;
            playBGM('win');
        } else {
            log.innerHTML = `<div style="color:var(--text); font-size:2rem;">无人生还...</div>`;
            playBGM('lose');
        }

        btn.disabled = false;
        btn.innerText = "🔄 再来一局 (重置)";
        btn.classList.add('restart');
        
        document.querySelector('.roster-area').style.pointerEvents = 'auto';
        document.querySelector('.roster-area').style.opacity = 1;
    }

    function resetGame() {
        document.getElementById('chase-modal').style.display = 'none';
        fighters = [];
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.remove('selected');
            c.style.backgroundColor = '';
            c.style.borderColor = '';
            c.style.color = '';
        });

        const arena = document.getElementById('arena');
        arena.innerHTML = `<div class="center-stage"><div class="log-content" id="log-content">选择 3-10 名同学<br>开启大乱斗！</div></div>`;

        const btn = document.getElementById('start-btn');
        btn.innerText = "选 3-10 人开始";
        btn.disabled = true;
        btn.classList.remove('restart');
    }

    function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
    function wait(ms) { return new Promise(r=>setTimeout(r, ms)); }

    // === 音效 ===
    let ctx;
    function initAudio() {
        if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === 'suspended') ctx.resume();
    }

    function playTone(type) {
        if(!ctx) return;
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);

        if(type === 'happy') {
            const now = t;
            o.type = 'square'; o.frequency.setValueAtTime(600, now);
            g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now+0.08);
            o.start(now); o.stop(now+0.08);
            
            const o2 = ctx.createOscillator(); const g2 = ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination);
            o2.type = 'square'; o2.frequency.setValueAtTime(600, now+0.1);
            g2.gain.setValueAtTime(0.1, now+0.1); g2.gain.linearRampToValueAtTime(0, now+0.18);
            o2.start(now+0.1); o2.stop(now+0.18);
            
            const o3 = ctx.createOscillator(); const g3 = ctx.createGain(); o3.connect(g3); g3.connect(ctx.destination);
            o3.type = 'square'; o3.frequency.setValueAtTime(400, now+0.2);
            g3.gain.setValueAtTime(0.1, now+0.2); g3.gain.linearRampToValueAtTime(0, now+0.3);
            o3.start(now+0.2); o3.stop(now+0.3);
            
            const o4 = ctx.createOscillator(); const g4 = ctx.createGain(); o4.connect(g4); g4.connect(ctx.destination);
            o4.type = 'triangle'; o4.frequency.setValueAtTime(300, now+0.35);
            g4.gain.setValueAtTime(0.2, now+0.35); g4.gain.exponentialRampToValueAtTime(0.01, now+0.8);
            o4.start(now+0.35); o4.stop(now+0.8);

        } else if (type === 'strong') {
            o.type = 'square';
            o.frequency.setValueAtTime(150, t);
            o.frequency.linearRampToValueAtTime(50, t+0.3);
            g.gain.setValueAtTime(0.2, t);
            g.gain.linearRampToValueAtTime(0, t+0.3);
            o.start(t); o.stop(t+0.3);
        } else if (type === 'ult') {
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(100, t);
            o.frequency.linearRampToValueAtTime(800, t+0.1); 
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t+1.2);
            o.start(t); o.stop(t+1.2);
        } else if (type === 'chase') {
            o.type = 'sine';
            o.frequency.setValueAtTime(800, t);
            o.frequency.linearRampToValueAtTime(400, t+0.3);
            g.gain.setValueAtTime(0.2, t);
            o.start(t); o.stop(t+0.3);
        } else if (type === 'block') {
            o.type = 'square'; o.frequency.value = 200; g.gain.value = 0.1;
            o.start(t); o.stop(t+0.1);
        } else if (type === 'lose') {
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(200, t);
            o.frequency.linearRampToValueAtTime(50, t+0.5);
            g.gain.setValueAtTime(0.2, t);
            g.gain.linearRampToValueAtTime(0, t+0.5);
            o.start(t); o.stop(t+0.5);
        }
    }

    function playBGM(type) {
        if(!ctx) return;
        const t = ctx.currentTime;
        if(type === 'win') {
            const notes = [523, 659, 783, 1046];
            for(let i=0; i<40; i++) {
                let o = ctx.createOscillator();
                let g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'square';
                o.frequency.value = notes[i%4];
                let st = t+i*0.25;
                g.gain.setValueAtTime(0.05, st);
                g.gain.linearRampToValueAtTime(0, st+0.1);
                o.start(st); o.stop(st+0.1);
            }
        } else {
            let o = ctx.createOscillator();
            let g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(300, t);
            o.frequency.linearRampToValueAtTime(50, t+10);
            g.gain.setValueAtTime(0.2, t);
            g.gain.linearRampToValueAtTime(0, t+10);
            o.start(t); o.stop(t+10);
        }
    }

</script>
