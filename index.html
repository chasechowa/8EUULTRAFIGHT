<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍭 ClassDojo: Ultimate Showdown FINAL Rev.7 🍭</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Zcool+KuaiLe&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff0f5; --text: #5d576b; --card-bg: rgba(255, 255, 255, 0.98); 
            --accent: #ff9a9e; --header-h: 180px;
        }
        body.boss-mode {
            --bg: #0d0000; --text: #ff3333; --card-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000;
        }
        body {
            background-color: var(--bg); font-family: 'Zcool KuaiLe', sans-serif;
            color: var(--text); margin: 0; height: 100vh; overflow: hidden; transition: 0.5s;
            display: flex; flex-direction: column;
        }

        .top-container {
            height: var(--header-h); background: var(--card-bg);
            border-bottom: 5px solid var(--accent); z-index: 5000;
            display: flex; flex-direction: column; padding: 10px 20px; box-sizing: border-box;
        }
        header { display: flex; justify-content: space-between; align-items: center; height: 40px; }
        .status-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .skill-name { font-size: 2.5rem; font-weight: bold; color: var(--accent); line-height: 1.2; }
        .skill-desc { font-size: 1.5rem; opacity: 0.9; margin-top: 5px; color: #444; }
        body.boss-mode .skill-desc { color: #ff9999; }
        .action-msg { font-size: 1.3rem; font-weight: bold; color: #ff6b6b; margin-top: 5px; }

        .arena { flex: 1; position: relative; width: 100%; overflow: hidden; }
        .fighter {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            transition: all 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94); z-index: 10;
        }
        .avatar { font-size: 5rem; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.1)); }
        .hp-box { width: 80px; height: 8px; background: #ddd; border: 1px solid #fff; border-radius: 5px; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; background: #caffbf; transition: width 0.2s; }
        .name-tag { font-size: 0.85rem; background: rgba(255,255,255,0.7); padding: 1px 6px; border-radius: 8px; margin-top: 3px; }

        #boss-entity {
            position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; align-items: center; z-index: 5;
        }
        .boss-img { font-size: 12rem; filter: drop-shadow(0 0 30px #f00); transition: 0.2s; }

        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 9000;
        }
        #victory-screen.horror { background: #000; color: #f00; border: 10px solid #0f0; }
        #victory-screen.horror #v-name { color: #0f0; text-shadow: 4px 4px #f00; font-family: 'Press Start 2P'; font-size: 1.5rem; }

        .victory-emoji { font-size: 12rem; margin-bottom: 20px; animation: victoryPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate; }
        @keyframes victoryPop { from { transform: scale(0.9); } to { transform: scale(1.1); } }

        .roster-area {
            height: 22vh; background: #fff; border-top: 4px solid var(--accent);
            display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; z-index: 5500;
        }
        .roster-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; overflow-y: auto; width: 100%; }
        .chip { padding: 5px 12px; background: #f5f5f5; border-radius: 15px; cursor: pointer; font-size: 0.8rem; }
        .chip.selected { background: var(--accent); color: white; }
        .start-btn {
            background: var(--accent); color: white; border: none; padding: 12px 50px;
            font-size: 1.5rem; border-radius: 30px; cursor: pointer; font-family: 'Zcool KuaiLe'; margin-bottom: 8px;
        }
        .start-btn:disabled { background: #ccc; cursor: not-allowed; }

        @keyframes fall { 100% { transform: translateY(1000px) rotate(720deg) scale(0); opacity: 0; } }
        .dead { animation: fall 0.8s forwards ease-in; }
        #flash { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; pointer-events: none; opacity: 0; z-index: 9999; }
        .shake-screen { animation: shake 0.1s infinite; }
        @keyframes shake { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-15px,15px);} 75%{transform:translate(15px,-15px);} }
    </style>
</head>

            const myNormals = [...MASTER_NORMAL].sort(() => 0.5 - Math.random()).slice(0, 17);
            const myStrongs = [...MASTER_STRONG].sort(() => 0.5 - Math.random()).slice(0, 2);
            const myUlt = MASTER_ULT[Math.floor(Math.random() * MASTER_ULT.length)];
            return {
                ...f, hp: 100, 
                emoji: EMOJI_LIBRARY[Math.floor(Math.random() * EMOJI_LIBRARY.length)],
                blockRate: Math.max(1, Math.min(15, f.score/10)),
                currentSkills: [...myNormals, ...myStrongs, myUlt]
            };
        });

        document.querySelectorAll('.fighter').forEach(f => f.remove());
        setupArena();
        initAudio();
        if (isBossMode) await bossCycle();
        else await royaleCycle();
    }

    function setupArena() {
        const arena = document.getElementById('arena');
        const scale = (isBossMode && fighters.length > 10) ? 0.7 : 1.0; 
        fighters.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = 'fighter';
            div.id = `f-${f.id}`;
            const angle = (i / fighters.length) * Math.PI + Math.PI; 
            const rX = arena.offsetWidth * 0.42;
            const rY = isBossMode ? arena.offsetHeight * 0.12 : arena.offsetHeight * 0.25;
            const centerY = isBossMode ? arena.offsetHeight * 0.85 : arena.offsetHeight * 0.65;
            div.style.left = `${Math.cos(angle) * rX + arena.offsetWidth/2 - 40}px`;
            div.style.top = `${Math.sin(angle) * rY + centerY - 40}px`;
            div.style.transform = `scale(${scale})`;
            div.innerHTML = `<div class="hp-box"><div class="hp-fill" id="hp-bar-${f.id}"></div></div><div class="avatar" id="av-${f.id}">${f.emoji}</div><div class="name-tag">${f.name}</div>`;
            arena.appendChild(div);
        });
    }

    async function attack(attacker, target) {
        const skillIdx = Math.floor(Math.random() * 20);
        const skill = attacker.currentSkills[skillIdx];
        let dmg = 0, isUlt = (skillIdx === 19);

        if (skillIdx < 17) dmg = Math.floor(Math.random() * 11) + 5;
        else if (skillIdx < 19) dmg = Math.floor(Math.random() * 16) + 20;
        else dmg = Math.floor(Math.random() * 31) + 50;

        const blocked = (Math.random() * 100) < (target.isBoss ? 5 : target.blockRate);
        document.getElementById('ui-skill').innerText = skill.n;
        document.getElementById('ui-desc').innerText = skill.e;
        document.getElementById('ui-msg').innerText = `➡ ${target.name} ${blocked ? '🛡️ 被格挡了！' : '(-'+dmg+')'}`;

        const atkEl = document.getElementById(`f-${attacker.id}`);
        const tarEl = target.isBoss ? document.getElementById('boss-entity') : document.getElementById(`f-${target.id}`);
        const ox = parseFloat(atkEl.style.left), oy = parseFloat(atkEl.style.top);
        const tx = target.isBoss ? window.innerWidth/2-40 : parseFloat(tarEl.style.left);
        const ty = target.isBoss ? window.innerHeight*0.22-40 : parseFloat(tarEl.style.top);

        if(isUlt) { triggerFlash(); atkEl.style.zIndex = 2000; }
        playSnd(blocked ? 'duang' : (isUlt ? 'bong' : 'jiu'));
        atkEl.style.transform += ` translate(${tx-ox}px, ${ty-oy}px) scale(${isUlt ? 2 : 1.3})`;
        await new Promise(r => setTimeout(r, 150));

        if(!blocked) {
            if(target.isBoss) bossHP -= dmg * 10;
            else {
                target.hp -= dmg;
                document.getElementById(`hp-bar-${target.id}`).style.width = Math.max(0, target.hp) + '%';
                if(target.hp <= 0) {
                    document.getElementById(`av-${target.id}`).innerText = "💀";
                    document.getElementById(`f-${target.id}`).classList.add('dead');
                    playFartSnd();
                }
            }
        }
        atkEl.style.transform = atkEl.style.transform.split(' translate')[0];
        setTimeout(() => atkEl.style.zIndex = 10, 150);
    }

    async function bossCycle() {
        bossHP = 30000;
        while (bossHP > 0 && fighters.filter(f => f.hp > 0).length > 0) {
            const alive = fighters.filter(f => f.hp > 0);
            for(let f of alive) {
                await attack(f, {name: "CHASE", isBoss: true});
                if(bossHP <= 0) break;
                await new Promise(r => setTimeout(r, 450));
            }
            if(bossHP <= 0) break;

            const isSmiley = Math.random() < 0.25; 
            const bossEmoji = document.getElementById('boss-emoji');
            
            if (isSmiley) {
                bossEmoji.innerText = "😊";
                document.getElementById('ui-skill').innerText = "CHASE: 保持微笑 :)";
                document.getElementById('ui-desc').innerText = "老师露出了极度诡异的笑容...";
                document.getElementById('ui-msg').innerText = "全体强制扣除 50 HP !!";
                playSnd('bong'); document.body.classList.add('shake-screen'); triggerFlash();
                alive.forEach(f => {
                    f.hp -= 50;
                    document.getElementById(`hp-bar-${f.id}`).style.width = Math.max(0, f.hp) + '%';
                    if(f.hp <= 0) { document.getElementById(`av-${f.id}`).innerText = "💀"; document.getElementById(`f-${f.id}`).classList.add('dead'); playFartSnd(); }
                });
            } else {
                bossEmoji.innerText = "👿";
                document.getElementById('ui-skill').innerText = "CHASE: " + BOSS_QUOTES[Math.floor(Math.random()*4)];
                document.getElementById('ui-desc').innerText = "老师投来了毁灭性的目光...";
                document.getElementById('ui-msg').innerText = "全体 HP -25";
                playSnd('bong'); document.body.classList.add('shake-screen');
                alive.forEach(f => {
                    f.hp -= 25;
                    document.getElementById(`hp-bar-${f.id}`).style.width = Math.max(0, f.hp) + '%';
                    if(f.hp <= 0) { document.getElementById(`av-${f.id}`).innerText = "💀"; document.getElementById(`f-${f.id}`).classList.add('dead'); playFartSnd(); }
                });
            }
            setTimeout(() => { document.body.classList.remove('shake-screen'); bossEmoji.innerText = "👿"; }, 500);
            await new Promise(r => setTimeout(r, 1500));
        }
        showWinner(bossHP <= 0 ? {name: "学生军团", emoji: "🏆"} : {name: "CHASE", emoji: "👿"});
    }

    async function royaleCycle() {
        while (fighters.filter(f => f.hp > 0).length > 1) {
            const alive = fighters.filter(f => f.hp > 0);
            const attacker = alive[Math.floor(Math.random() * alive.length)];
            const target = alive.filter(f => f !== attacker)[Math.floor(Math.random() * (alive.length - 1))];
            await attack(attacker, target);
            await new Promise(r => setTimeout(r, 800));
        }
        showWinner();
    }

    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playFartSnd() {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(100, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    }
    function playSnd(t) {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if(t==='jiu'){o.type='square';o.frequency.setValueAtTime(1000,now);o.frequency.exponentialRampToValueAtTime(100,now+0.1);}
        if(t==='bong'){o.type='triangle';o.frequency.setValueAtTime(150,now);g.gain.setValueAtTime(0.4,now);}
        if(t==='duang'){o.type='sawtooth';o.frequency.setValueAtTime(200,now);o.frequency.linearRampToValueAtTime(600,now+0.15);}
        o.start(); o.stop(now+0.2);
    }
    function playVictoryAudio(isHorror) {
        let time = audioCtx.currentTime;
        if(isHorror) {
            for(let i=0; i<15; i++) {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type='sawtooth'; o.frequency.setValueAtTime(Math.random()*50+40, time + i*0.3);
                o.frequency.linearRampToValueAtTime(Math.random()*100+20, time + i*0.3 + 0.2);
                g.gain.setValueAtTime(0.2, time+i*0.3); g.gain.linearRampToValueAtTime(0, time+i*0.3+0.2);
                o.connect(g); g.connect(audioCtx.destination); o.start(time+i*0.3); o.stop(time+i*0.3+0.3);
            }
        } else {
            const melody = [{f:523,d:0.4},{f:659,d:0.4},{f:783,d:0.4},{f:1046,d:0.8},{f:783,d:0.4},{f:1046,d:1.2}];
            melody.forEach(n => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type='square'; o.frequency.setValueAtTime(n.f,time); g.gain.setValueAtTime(0.1,time);
                o.connect(g); g.connect(audioCtx.destination); o.start(time); o.stop(time+n.d); time+=n.d;
            });
        }
    }
    function triggerFlash() {
        const f = document.getElementById('flash'); f.style.opacity = 0.5;
        setTimeout(() => f.style.opacity = 0, 100);
    }

    function showWinner(bossWinner) {
        isFighting = false;
        const winner = bossWinner || fighters.find(f => f.hp > 0);
        const vs = document.getElementById('victory-screen');
        const isHorror = bossWinner && bossWinner.name === "CHASE";
        if(isHorror) vs.classList.add('horror'); else vs.classList.remove('horror');
        playVictoryAudio(isHorror);
        document.getElementById('v-emoji').innerText = winner ? winner.emoji : "💀";
        document.getElementById('v-name').innerText = winner ? (winner.name + " 终结了战斗！") : "无人生还...";
        vs.style.display = 'flex';
        document.getElementById('start-btn').disabled = false;
    }

    window.onload = init;
</script>
